# ML Quant Download Configuration
# ================================
# Comprehensive crypto data download for ML return prediction models.
# Total estimated size: ~6.2 TB
#
# Usage:
#   td-fire config-download --config configs/ml_quant_download.yaml --profile btc_full --dry-run
#   td-fire config-download --config configs/ml_quant_download.yaml --profile btc_full
#   td-fire incremental --config configs/ml_quant_download.yaml --profile btc_full

version: "1.0"

# Storage settings - RAID storage with 87TB available
storage:
  root_dir: "/mnt/raid/crypto"
  format: "csv"

# ============================================================================
# DOWNLOAD PROFILES
# ============================================================================

profiles:
  # --------------------------------------------------------------------------
  # Profile 1: btc_full - BTC with ALL data types including L2
  # Estimated size: ~195 GB
  # --------------------------------------------------------------------------
  btc_full:
    description: "BTC-PERPETUAL with all data types including L2 orderbook"
    exchanges:
      - binance-futures
    data_types:
      - trades
      - quotes
      - incremental_book_L2
      - book_snapshot_25
      - book_snapshot_5
      - derivative_ticker
      - liquidations
    symbols:
      binance-futures:
        - BTCUSDT
    date_range:
      start: "2019-11-17"  # Earliest available for binance-futures
      end: null  # Today

  # --------------------------------------------------------------------------
  # Profile 2: eth_sol_full - ETH & SOL with all data types (except L2)
  # Estimated size: ~159 GB
  # --------------------------------------------------------------------------
  eth_sol_full:
    description: "ETH and SOL perpetuals with all data types except L2"
    exchanges:
      - binance-futures
    data_types:
      - trades
      - quotes
      - book_snapshot_25
      - book_snapshot_5
      - derivative_ticker
      - liquidations
    symbols:
      binance-futures:
        - ETHUSDT
        - SOLUSDT
    date_range:
      start: "2019-11-27"  # ETH earliest; SOL available from 2020-08-31
      end: null

