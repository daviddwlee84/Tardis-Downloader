# Spot Download Configuration
# ============================
# Binance spot and Coinbase spot data for ML/quant research.
# Complements ml_quant_download.yaml (binance-futures).
# Total estimated size: ~2.5–3 TB
#
# Usage:
#   td-fire config-download --config configs/spot_download.yaml --profile binance_spot_btc --dry-run
#   td-fire config-download --config configs/spot_download.yaml --profile binance_spot_btc
#   td-fire incremental --config configs/spot_download.yaml --profile binance_spot_btc

version: "1.0"

# Storage settings - RAID storage
storage:
  root_dir: "/mnt/raid/crypto"
  format: "csv"

# ============================================================================
# DOWNLOAD PROFILES
# ============================================================================

profiles:
  # --------------------------------------------------------------------------
  # Profile 1: binance_spot_btc - BTC spot from 2019
  # Estimated size: ~25 GB
  # --------------------------------------------------------------------------
  binance_spot_btc:
    description: "Binance spot BTC - trades and book snapshots from 2019"
    exchanges:
      - binance
    data_types:
      - trades
      - book_snapshot_25
    symbols:
      binance:
        - BTCUSDT
    date_range:
      start: "2019-03-01"  # Earliest available for binance spot
      end: null  # Today

  # --------------------------------------------------------------------------
  # Profile 2: binance_spot_eth_sol - ETH & SOL spot
  # Estimated size: ~40 GB
  # --------------------------------------------------------------------------
  binance_spot_eth_sol:
    description: "Binance spot ETH and SOL - trades and book snapshots"
