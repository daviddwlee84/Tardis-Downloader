# ============================================================================
# INCREMENTAL DOWNLOAD SETTINGS
# ============================================================================

incremental:
  enabled: true
  state_file: "/mnt/raid/crypto/.tardis_download_state.json"
  auto_continue: true

# ============================================================================
# DOWNLOAD BEHAVIOR
# ============================================================================

download:
  concurrency: 10  # Higher concurrency for faster downloads
  skip_existing: true
  retry_attempts: 5
  timeout_seconds: 600  # Longer timeout for large L2 files

# ============================================================================
# INDEX SETTINGS (for metadata indexing)
# ============================================================================

index:
  enabled: true
  index_file: "/mnt/raid/crypto/.tardis_index.json"
  auto_update: true  # Update index after each download
  db_file: "/mnt/raid/crypto/.tardis.db"
  existing_check: "index"  # "index" (SQLite), "filesystem" (Path.exists), "override" (redownload all)
