# ============================================================================
# INCREMENTAL DOWNLOAD SETTINGS
# ============================================================================

incremental:
  enabled: true
  state_file: "/mnt/raid/crypto/.tardis_spot_state.json"
  auto_continue: true

# ============================================================================
# DOWNLOAD BEHAVIOR
# ============================================================================

download:
  concurrency: 10
  skip_existing: true
  retry_attempts: 5
  timeout_seconds: 600

# ============================================================================
# INDEX SETTINGS
# ============================================================================

index:
  enabled: true
  index_file: "/mnt/raid/crypto/.tardis_spot_index.json"
  auto_update: true
  db_file: "/mnt/raid/crypto/.tardis_spot.db"
  existing_check: "index"  # "index" (SQLite), "filesystem" (Path.exists), "override" (redownload all)
